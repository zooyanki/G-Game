<!DOCTYPE html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover"
    />
    <title>Гардарики</title>
    <link
      rel="icon"
      href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'><rect width='16' height='16' fill='%232f6b4f'/></svg>"
    />
    <style>
      html,
      body,
      #game {
        margin: 0;
        width: 100%;
        height: 100%;
        background: #111;
        overflow: hidden;
        touch-action: none;
      }

      canvas {
        image-rendering: pixelated;
        image-rendering: crisp-edges;
      }

      #rotate-hint {
        display: none;
      }

      #touch {
        position: fixed;
        inset: 0;
        z-index: 2;
        pointer-events: none;
        user-select: none;
      }

      #touch[hidden] {
        display: none;
      }

      #touch [hidden] {
        display: none;
      }

      #stick,
      #touch button {
        pointer-events: auto;
        touch-action: none;
      }

      #stick {
        position: absolute;
        left: max(16px, env(safe-area-inset-left));
        bottom: max(16px, env(safe-area-inset-bottom));
        width: 116px;
        height: 116px;
        box-sizing: border-box;
        border: 3px solid rgba(244, 240, 230, 0.85);
        border-radius: 50%;
        background: rgba(0, 0, 0, 0.35);
      }

      #nub {
        position: absolute;
        left: 50%;
        top: 50%;
        width: 48px;
        height: 48px;
        margin: -24px 0 0 -24px;
        border-radius: 50%;
        background: rgba(244, 240, 230, 0.92);
      }

      #jump,
      #attack,
      #swap,
      #super {
        position: absolute;
        border: 3px solid #f4f0e6;
        border-radius: 50%;
        background: rgba(26, 26, 26, 0.85);
        color: #f4f0e6;
        font-family: ui-monospace, monospace;
        font-size: 15px;
        padding: 0;
      }

      #jump {
        right: max(16px, env(safe-area-inset-right));
        bottom: max(20px, env(safe-area-inset-bottom));
        width: 92px;
        height: 92px;
      }

      #attack {
        right: calc(max(16px, env(safe-area-inset-right)) + 106px);
        bottom: max(20px, env(safe-area-inset-bottom));
        width: 82px;
        height: 82px;
      }

      #swap {
        right: calc(max(16px, env(safe-area-inset-right)) + 16px);
        bottom: calc(max(20px, env(safe-area-inset-bottom)) + 106px);
        width: 62px;
        height: 62px;
        font-size: 13px;
      }

      #super {
        right: calc(max(16px, env(safe-area-inset-right)) + 116px);
        bottom: calc(max(20px, env(safe-area-inset-bottom)) + 96px);
        width: 62px;
        height: 62px;
        font-size: 13px;
        opacity: 0.35;
      }

      #super.ready {
        opacity: 1;
        border-color: #f2d48a;
        color: #f2d48a;
        box-shadow: 0 0 14px rgba(242, 212, 138, 0.9);
      }

      #card-buttons {
        position: absolute;
        left: 50%;
        top: 70%;
        transform: translate(-50%, -50%);
        display: flex;
        gap: 16px;
      }

      #card-buttons button {
        border: 3px solid #f4f0e6;
        background: #1a1a1a;
        color: #f4f0e6;
        font-family: ui-monospace, monospace;
        font-size: 18px;
        padding: 12px 18px;
      }

      @media (orientation: portrait) and (pointer: coarse) {
        #rotate-hint {
          position: fixed;
          inset: 0;
          z-index: 5;
          display: flex;
          align-items: center;
          justify-content: center;
          padding: 24px;
          background: #111;
          color: #f4f0e6;
          font-family: ui-monospace, monospace;
          font-size: 18px;
          text-align: center;
        }
      }
    </style>
  </head>
  <body>
    <div id="game"></div>
    <div id="rotate-hint">Поверните телефон горизонтально</div>
    <div id="touch" hidden>
      <div id="stick"><div id="nub"></div></div>
      <button id="attack" type="button" data-action="attack">Меч</button>
      <button id="jump" type="button" data-action="jump">Прыжок</button>
      <button id="swap" type="button" data-action="swap">Смена</button>
      <button id="super" type="button" data-action="super">Луч</button>
      <div id="card-buttons" hidden>
        <button id="retry" type="button" data-action="retry">Ещё раз</button>
        <button id="river" type="button" data-action="river">К реке</button>
      </div>
    </div>
    <script type="module" src="/src/main.ts?v=6"></script>
  </body>
</html>
